name: USBTool Android 10 ARM64 Debug Build

on:
  push:
    paths:
      - "USBTool-Android10-ARM64-phase8-cloud-build.zip"
      - ".github/workflows/usbtool-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare source archive
        run: |
          test -f USBTool-Android10-ARM64-phase8-cloud-build.zip
          unzip -q USBTool-Android10-ARM64-phase8-cloud-build.zip -d .
          test -f USBTool/settings.gradle
          test -f USBTool/.github/workflows/android-debug.yml
      - name: Inspect app sources for no-root runtime work
        run: |
          chmod +x scripts/phase9-inspect.sh
          (cd USBTool && ../scripts/phase9-inspect.sh)
      - name: Patch Android API compatibility
        run: |
          SOURCE="USBTool/app/src/main/java/com/ssai/usbtool/runtime/bootstrap/ImportedApkDescriptorReader.java"
          test -f "$SOURCE"
          grep -q 'c.isolatedProcess' "$SOURCE"
          sed -i 's/c.isolatedProcess/false/g' "$SOURCE"
          ! grep -q 'c.isolatedProcess' "$SOURCE"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle 8.7
        run: |
          curl --fail --location --retry 3 --retry-delay 2 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-8.7-bin.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
          /opt/gradle-8.7/bin/gradle --version
      - name: Locate Android SDK tools
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          else
            find "$ANDROID_HOME" -maxdepth 4 -name sdkmanager -type f -print || true
            exit 1
          fi
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Ensure Android SDK packages
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Run Android build and tests
        working-directory: USBTool
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :fixture:assembleDebug
      - name: Re-sign app APK as V1 only and verify
        run: |
          APK="USBTool/app/build/outputs/apk/debug/app-debug.apk"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          KEY="$HOME/.android/debug.keystore"
          test -f "$APK"
          mkdir -p "$HOME/.android"
          if [ ! -f "$KEY" ]; then
            keytool -genkeypair -v -keystore "$KEY" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          SIGNED="\${APK%.apk}-v1.apk"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$KEY" -storepass android -keypass android -signedjar "$SIGNED" "$APK" androiddebugkey
          mv "$SIGNED" "$APK"
          "$SIGNER" verify --verbose "$APK" | tee /tmp/apk-verify.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/apk-verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): false' /tmp/apk-verify.txt
          ls -l "$APK" USBTool/fixture/build/outputs/apk/debug/*.apk
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: USBTool-Android10-ARM64-debug-apks
          path: |
            USBTool/app/build/outputs/apk/debug/*.apk
            USBTool/fixture/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
