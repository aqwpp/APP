name: USBTool Android 10 ARM64 Debug Build

on:
  push:
    paths:
      - "USBTool-Android10-ARM64-phase8-cloud-build.zip"
      - ".github/workflows/usbtool-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare source archive
        run: |
          test -f USBTool-Android10-ARM64-phase8-cloud-build.zip
          unzip -q USBTool-Android10-ARM64-phase8-cloud-build.zip -d .
          test -f USBTool/settings.gradle
          test -f USBTool/.github/workflows/android-debug.yml
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle 8.7
        run: |
          curl --fail --location --retry 3 --retry-delay 2 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-8.7-bin.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
          /opt/gradle-8.7/bin/gradle --version
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run Android build and tests
        working-directory: USBTool
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :fixture:assembleDebug
      - name: Verify APKs
        run: |
          ls -l USBTool/app/build/outputs/apk/debug/*.apk
          ls -l USBTool/fixture/build/outputs/apk/debug/*.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --v1-signing-enabled true --v2-signing-enabled false USBTool/app/build/outputs/apk/debug/*.apk
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: USBTool-Android10-ARM64-debug-apks
          path: |
            USBTool/app/build/outputs/apk/debug/*.apk
            USBTool/fixture/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
