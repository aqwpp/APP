name: USBTool Android 10 ARM64 Debug Build

on:
  push:
    paths:
      - "USBTool-Android10-ARM64-phase8-cloud-build.zip"
      - ".github/workflows/usbtool-build.yml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usbtool-android10-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare source archive
        run: |
          test -f USBTool-Android10-ARM64-phase8-cloud-build.zip
          unzip -q USBTool-Android10-ARM64-phase8-cloud-build.zip -d .
          test -f USBTool/settings.gradle
          test -f USBTool/.github/workflows/android-debug.yml
      - name: Inspect app sources for no-root runtime work
        run: |
          chmod +x scripts/phase9-inspect.sh
          (cd USBTool && ../scripts/phase9-inspect.sh)
      - name: Patch Android API compatibility
        run: |
          SOURCE="USBTool/app/src/main/java/com/ssai/usbtool/runtime/bootstrap/ImportedApkDescriptorReader.java"
          test -f "$SOURCE"
          grep -q 'c.isolatedProcess' "$SOURCE"
          sed -i 's/c.isolatedProcess/false/g' "$SOURCE"
          ! grep -q 'c.isolatedProcess' "$SOURCE"
      - name: Harden APK import and app database persistence
        run: |
          chmod +x scripts/phase10-hardening.sh
          ./scripts/phase10-hardening.sh
      - name: Add experimental DEX and resource loader
        run: |
          chmod +x scripts/phase11-dex-loader.sh
          ./scripts/phase11-dex-loader.sh
      - name: Add retained runtime sessions and safe Application class probe
        run: |
          chmod +x scripts/phase12-runtime-session.sh
          ./scripts/phase12-runtime-session.sh
      - name: Add opt-in Application bootstrap experiment
        run: |
          chmod +x scripts/phase13-application-bootstrap.sh
          ./scripts/phase13-application-bootstrap.sh
      - name: Isolate per-profile SharedPreferences (Phase 20)
        run: |
          chmod +x scripts/phase20-profile-storage-isolation.sh
          ./scripts/phase20-profile-storage-isolation.sh
      - name: Import VirtualApp Java and AIDL core (Phase 14)
        run: |
          chmod +x scripts/phase14-import-virtualapp-core.sh
          ./scripts/phase14-import-virtualapp-core.sh
      - name: Add VirtualApp package parser diagnostics (Phase 30)
        run: |
          chmod +x scripts/phase30-virtualapp-package-parser-diagnostics.sh
          ./scripts/phase30-virtualapp-package-parser-diagnostics.sh
      - name: Fix Android 10 PackageParser SigningDetails (Phase 33)
        run: |
          chmod +x scripts/phase33-android10-signingdetails-compat.sh
          ./scripts/phase33-android10-signingdetails-compat.sh
      - name: Add safe VirtualApp readiness diagnostics (Phase 15)
        run: |
          chmod +x scripts/phase15-virtualapp-readiness.sh
          ./scripts/phase15-virtualapp-readiness.sh
      - name: Enable ARM64 VirtualApp native build (Phase 16)
        run: |
          chmod +x scripts/phase16-arm64-native-build.sh
          ./scripts/phase16-arm64-native-build.sh
      - name: Add VirtualApp runtime topology audit (Phase 17)
        run: |
          chmod +x scripts/phase17-runtime-topology-audit.sh
          ./scripts/phase17-runtime-topology-audit.sh
      - name: Audit VirtualApp manifest topology (Phase 18)
        run: |
          chmod +x scripts/phase18-manifest-topology-audit.sh
          ./scripts/phase18-manifest-topology-audit.sh
      - name: Add opt-in VirtualCore startup probe (Phase 21)
        run: |
          chmod +x scripts/phase21-virtualcore-startup-probe.sh
          ./scripts/phase21-virtualcore-startup-probe.sh
      - name: Add experimental guest APK install and launch (Phase 22)
        run: |
          chmod +x scripts/phase22-guest-package-install-launch.sh
          ./scripts/phase22-guest-package-install-launch.sh
      - name: Move guest APK install and launch off the UI thread (Phase 23)
        run: |
          chmod +x scripts/phase23-background-install.sh
          ./scripts/phase23-background-install.sh
      - name: Fix VirtualCore startup Throwable compile handling (Phase 24)
        run: |
          chmod +x scripts/phase24-catch-startup-throwable.sh
          ./scripts/phase24-catch-startup-throwable.sh
      - name: Audit VirtualApp runtime call-path safeguards (Phase 25)
        run: |
          chmod +x scripts/phase25-runtime-safety-audit.sh
          ./scripts/phase25-runtime-safety-audit.sh
      - name: Add guest install and launch diagnostics (Phase 26)
        run: |
          chmod +x scripts/phase26-guest-launch-diagnostics.sh
          ./scripts/phase26-guest-launch-diagnostics.sh
      - name: Initialize VirtualCore in every process before providers (Phase 27)
        run: |
          chmod +x scripts/phase27-per-process-virtualcore-startup.sh
          ./scripts/phase27-per-process-virtualcore-startup.sh
      - name: Add on-device VirtualApp runtime diagnostics (Phase 28)
        run: |
          chmod +x scripts/phase28-runtime-diagnostics.sh
          ./scripts/phase28-runtime-diagnostics.sh
      - name: Add accurate native library runtime probe (Phase 31)
        run: |
          chmod +x scripts/phase31-native-library-runtime-probe.sh
          ./scripts/phase31-native-library-runtime-probe.sh
      - name: Add full VirtualApp crash diagnostics (Phase 29)
        run: |
          chmod +x scripts/phase29-full-virtualapp-crash-report.sh
          ./scripts/phase29-full-virtualapp-crash-report.sh
      - name: Add VirtualApp Binder server startup breadcrumbs (Phase 32)
        run: |
          chmod +x scripts/phase32-binder-server-startup.sh
          ./scripts/phase32-binder-server-startup.sh
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Locate Android SDK tools
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          else
            find "$ANDROID_HOME" -maxdepth 4 -name sdkmanager -type f -print || true
            exit 1
          fi
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Ensure Android SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Restore stable debug signing key before Gradle signing
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: usbtool-debug-signing-key-v1
      - name: Run Android build and tests
        working-directory: USBTool
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :fixture:assembleDebug
      - name: Audit merged manifest and ARM64 APK contents
        run: |
          chmod +x scripts/phase19-runtime-artifact-audit.sh
          ./scripts/phase19-runtime-artifact-audit.sh
      - name: Verify Gradle-produced APK signatures and alignment (no re-signing)
        run: |
          APK="USBTool/app/build/outputs/apk/debug/app-debug.apk"
          FIXTURE="USBTool/fixture/build/outputs/apk/debug/fixture-debug.apk"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -f "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"
          "$ZIPALIGN" -c -v 4 "$FIXTURE"
          "$SIGNER" verify --verbose "$APK" | tee /tmp/apk-verify.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/apk-verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): false' /tmp/apk-verify.txt
          "$SIGNER" verify --verbose "$FIXTURE" | tee /tmp/fixture-verify.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/fixture-verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): false' /tmp/fixture-verify.txt
          sha256sum "$APK" "$FIXTURE"
          ls -l "$APK" "$FIXTURE"
      - name: Package reproducible source project
        run: |
          zip -qr USBTool-Android10-ARM64-phase28-source.zip USBTool scripts .github/workflows/usbtool-build.yml -x 'USBTool/**/build/*' 'USBTool/.gradle/*' 'USBTool/.idea/*'
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: USBTool-Android10-ARM64-debug-apks
          path: |
            USBTool/app/build/outputs/apk/debug/*.apk
            USBTool/fixture/build/outputs/apk/debug/*.apk
            USBTool/BUILD_AUDIT_PHASE19.txt
            USBTool/BUILD_AUDIT_PHASE25.txt
            USBTool/BUILD_AUDIT_PHASE26.txt
            USBTool/BUILD_AUDIT_PHASE27.txt
            USBTool/BUILD_AUDIT_PHASE28.txt
            USBTool-Android10-ARM64-phase28-source.zip
          if-no-files-found: error
          retention-days: 30
